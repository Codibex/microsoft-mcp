name: Release

# Semantic release: push a tag like v0.2.0 and this builds, tests,
# publishes binaries per OS and creates the GitHub Release.
# Prereleases: tag v0.2.0-rc.1 (contains a hyphen -> marked as prerelease).
# Rebuild assets for an existing tag: run manually (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prefix=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
            echo "suffix=${VERSION#*-}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prefix=$VERSION" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet build MicrosoftMcp.slnx --nologo -c Release
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -p:VersionSuffix='${{ steps.version.outputs.suffix }}'

      - name: Test
        run: >
          dotnet test MicrosoftMcp.slnx --no-build --nologo -c Release
          -p:VersionPrefix=${{ steps.version.outputs.prefix }}
          -p:VersionSuffix='${{ steps.version.outputs.suffix }}'

      - name: Publish binaries (self-contained, single file, no runtime needed)
        run: |
          for spec in "MicrosoftMcp.Outlook.Host:microsoft-mcp-outlook" "MicrosoftMcp.OneDrive.Host:microsoft-mcp-onedrive" "MicrosoftMcp.Calendar.Host:microsoft-mcp-calendar"; do
            proj="${spec%%:*}"; bin="${spec##*:}"
            for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-arm64; do
              dotnet publish "src/$proj" -c Release -r "$rid" \
                --self-contained true -p:PublishSingleFile=true \
                -p:VersionPrefix=${{ steps.version.outputs.prefix }} \
                -p:VersionSuffix='${{ steps.version.outputs.suffix }}' \
                -o "dist/$bin/$rid"
            done
          done

      - name: Pack assets + checksums
        run: |
          mkdir -p assets
          for bin in microsoft-mcp-outlook microsoft-mcp-onedrive microsoft-mcp-calendar; do
            for rid in linux-x64 linux-arm64 win-x64 win-arm64 osx-arm64; do
              (cd "dist/$bin/$rid" && zip -q "$GITHUB_WORKSPACE/assets/$bin-${{ steps.version.outputs.tag }}-$rid.zip" "$bin" "$bin.exe" appsettings.json)
            done
          done
          (cd assets && sha256sum *.zip > checksums.txt)

      - name: Resolve release notes (curated file or fallback)
        id: notes
        run: |
          if [ -f "docs/releases/${{ steps.version.outputs.tag }}.md" ]; then
            echo "path=docs/releases/${{ steps.version.outputs.tag }}.md" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Local MCP servers (Stdio) for Microsoft 365 via Microsoft Graph.";
              echo "Self-contained binaries – no .NET runtime needed (≈120 MB each, trimming intentionally off for MSAL/Kiota compatibility).";
              echo "See README in the repo for setup (Entra app, recipes, troubleshooting).";
            } > "$GITHUB_WORKSPACE/release-notes-fallback.md"
            echo "path=$GITHUB_WORKSPACE/release-notes-fallback.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: assets/*
          body_path: ${{ steps.notes.outputs.path }}
